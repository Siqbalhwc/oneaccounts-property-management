name: Tenant Portal isolation tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pgserver psycopg2-binary
      - name: Run the Tenant Portal tests
        run: python backend/tests/portal/run_all.py
        env:
          REQUIRE_PG: "1"
